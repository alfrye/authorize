---
apiVersion: k3d.io/v1alpha3
kind: Simple
metaData:
  name: my-cluster
servers: 1
agents: 0
kubeAPI:
  host: "myhost.my.domain"
  hostIP: "12.0.0.1"
  hostPort: '6445'
image: docker.io/rancher/k3s:v1.21.5-k3s1
network: my-custom-net
ports:
- port: 8080:80
  nodeFilters:
  - loadbalancer
registries:
  # define how registries should be created or used
  create:
    # creates a default registry to be used with the cluster; same as `--registry-create registry.localhost`
    name: registry.localhost
    host: "0.0.0.0"
    hostPort: "5000"
    proxy:
      # omit this to have a "normal" registry, set this to create a registry proxy (pull-through cache)
      remoteURL: https://registry-1.docker.io # mirror the DockerHub registry
      username: "" # unauthenticated
      password: "" # unauthenticated
    volumes:
    - /some/path:/var/lib/registry # persist registry data locally
  use:
  - k3d-myotherregistry:5000
options:
  k3d:
    # k3d runtime settings
    wait: true # wait for cluster to be usable before returning; same as `--wait` (default: true)
    timeout: "60s" # wait timeout before aborting; same as `--timeout 60s`
    disableLoadbalancer: false # same as `--no-lb`
    disableImageVolume: false # same as `--no-image-volume`
    disableRollback: false # same as `--no-Rollback`
  k3s:
    # options passed on to K3s itself
    extraArgs:
    # additional arguments passed to the `k3s server|agent` command; same as `--k3s-arg`
    - arg: "--tls-san=my.host.domain"
      nodeFilters:
      - server:*
    nodeLabels:
    - label: foo=bar # same as `--k3s-node-label 'foo=bar@agent:1'` -> this results in a Kubernetes node label
      nodeFilters:
      - server:0
